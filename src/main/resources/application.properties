spring.application.name=SpringSecurityJWTDemo
#====== DATABASE
spring.datasource.url=jdbc:h2:file:./data/devdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
#====== JPA/HIBERNATE
# JPA/Hibernate 'update' creates tables automatically based on your @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#====== H2 CONSOLE
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
#====== JWT
jwt.expiration=86400000
jwt.secret=${JWT_SECRET}
#====== LOGGING
logging.pattern.console=%clr(%d{HH:mm:ss}){faint} [uuid=%X{requestId}] %clr(%-1level){highlight} [%clr(%logger{0}){blue}] - %clr(%msg){faint}%n
spring.devtools.restart.enabled=false